# MediaMTX Configuration for Ecovacs Deebot Video Proxy

logLevel: info
logDestinations: [stdout]

# RTSP Server
rtsp: yes
protocols: [tcp, udp]
rtspAddress: :8554
rtspsAddress: :8322

# WebRTC & HLS (allows viewing directly in browser on port 8889 / 8888)
webrtc: yes
webrtcAddress: :8889
hls: yes
hlsAddress: :8888

# RTMP Server
rtmp: no

# Stream paths configuration
paths:
  all:
    # Allow local publisher without authentication
    publishUser: ""
    publishPass: ""
    readUser: ""
    readPass: ""
