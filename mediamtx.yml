# MediaMTX Configuration for Ecovacs Deebot Video Proxy
logLevel: info
logDestinations: [stdout]

# RTSP Server
rtsp: yes
rtspTransports: [tcp, udp]
rtspAddress: :8554
rtspsAddress: :8322

# WebRTC & HLS (allows viewing directly in browser on port 8889 / 8888)
webrtc: yes
webrtcAddress: :8889
hls: yes
hlsAddress: :8888

# Unused protocols
rtmp: no
srt: no

# Authentication for RTSP, WebRTC, and HLS
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
  - user: "admin"
    pass: "cheese"
    permissions:
      - action: read

paths:
  all:
