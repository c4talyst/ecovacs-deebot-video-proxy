# Ecovacs Deebot Video Proxy Configuration

ecovacs:
  # Account Credentials
  username: "your-email@example.com"
  password: "your-ecovacs-password"
  country: "za"  # 2-letter country code (e.g. us, de, za, fr, uk)

  # Pre-authorized device identity (populated automatically by setup.py)
  device_id: ""
  access_token: ""
  user_id: ""

  # Camera / Video Manager PIN (leave blank if password is disabled in mobile app)
  pin: ""

  # Target Robot (leave blank to automatically select the first discovered robot)
  robot_did: ""

rtsp:
  # Path mounted on the RTSP server: rtsp://<host>:8554/<path>
  path: "live"
  port: 8554

  # Encoding parameters for ffmpeg pipeline
  fps: 16
  bitrate: "1500k"
  preset: "ultrafast"
  tune: "zerolatency"

  # Optional: Protect all services (RTSP, WebRTC, HLS, HTTP Web UI, MJPEG) with username and password
  # Leave blank for unauthenticated public stream: rtsp://<host>:8554/live
  # If configured, all feeds and Web UI require auth (e.g. rtsp://user:pass@<host>:8554/live, HTTP Basic)
  username: ""
  password: ""
streamer:
  # Reconnection & Keepalive watchdog
  reconnect_delay_seconds: 5
  appping_interval_seconds: 35
  stream_timeout_seconds: 30
  # Power-saving mode: Only stream video when Robot or Station is active (docked = standby, headlights off)
  active_only_video: false
  standby_fps: 2

overlay:
  # On-Screen Display (OSD) real-time telemetry overlay on RTSP stream & Web UI
  enabled: true
  show_timestamp: true
  show_battery: true
  show_mode: true
  show_station: true
  show_maintenance: true
  show_robot_name: true
  position: "top_left"  # top_left, top_right, bottom_left, bottom_right, top_banner

logging:
  level: "INFO"  # DEBUG or INFO
